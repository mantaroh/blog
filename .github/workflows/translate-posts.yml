name: Translate published posts

on:
  push:
    branches:
      - master
    paths:
      - 'src/content/blog/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-blog-posts
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Translate published Japanese posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node .github/scripts/translate-posts.mjs

      - name: Commit translated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog-en

          if git diff --cached --quiet; then
            echo "No translated changes to commit."
            exit 0
          fi

          git commit -m "Update AI-translated English posts"
          git push
